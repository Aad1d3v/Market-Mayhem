# ==============================================================================
# Market Mayhem — Render Blueprint
# Deploys: Web Service (Docker) + managed PostgreSQL, env vars pre-wired.
# Use: Render Dashboard → New → Blueprint → point at this repo.
#
# NOTE: a Blueprint is the only path where this file is read. If you create a
# plain Docker Web Service instead, render.yaml is ignored and you must add the
# environment variables yourself in the dashboard (see LAUNCH-CHECKLIST.md).
# ==============================================================================

services:
  - type: web
    name: aadiinvest
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Database connection string comes from the managed Postgres below —
      # never hardcoded, never committed.
      - key: DATABASE_URL
        fromDatabase:
          name: aadiinvest-db
          property: connectionString
      - key: INTERNAL_DATABASE_URL
        fromDatabase:
          name: aadiinvest-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # CLIENT_URL is derived at runtime from Render's RENDER_EXTERNAL_URL
      # (see server/src/config.ts) — no hardcoded service URL needed.
      - key: ADMIN_EMAIL
        value: admin@aadiinvest.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MARKET_DATA_PROVIDER
        value: simulated
      # Optional integrations — leave unset unless you configure them.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: aadiinvest-db
    plan: free
    region: oregon
    databaseName: aadiinvest
    user: aadiinvest
    postgresMajorVersion: "16"
